name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check VERSION matches tag
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: ./build.sh zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.zip \
            --title "EOS Cue Helper ${GITHUB_REF_NAME#v}" \
            --notes "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
